  metabolism_calculators:
    new:
      explanation: "目標体重からホラー映画視聴時間ノルマを算出します"
      question: "以下質問にお答えください"
      follow: "無理せず、減量は計画的に！"
      current_weight: 現 在 の 体 重 は ?
      target_weight: 目 標 体 重 は ?
      achieved_date: い つ ま で に 達 成 し た い ？
      until: ま で に
      calculate: 計算する
      asterisk1: ※本アプリ計算式は、ホラー映画を見ることによりどのくらいカロリーを消費できるかを求めています。
      asterisk2: 「体重の減少＝脂肪の減少」と定義しているため、1kgの脂肪が持つエネルギー量が一般的に7000～7700kcalと言われていることに基づき、1kgの脂肪を燃焼するために必要なカロリーを7200kcalと設定しています。
      asterisk3: 1日あたりの目標減少カロリーを「目標減量体重 × 7200 ÷ ダイエット日数」として計算しています。
      asterisk4: ホラー映画を観て消費するカロリーは、90分のホラー映画を観ると平均113カロリーが消費されることがわかっています。
      asterisk5: 目標減少カロリーを、ホラー映画を観ることによる1分間あたりのカロリー消費量で割ることで、目標減少カロリーを達成するために必要なホラー映画の視聴分数を算出しています。
      ref: 参考文献：https://www.theguardian.com/film/2012/oct/29/horror-movies-help-burn-calories
