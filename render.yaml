databases:
  - name: Horror_Burn
    databaseName: horror_burn_ls9a
    user: HorrorBurn
    region: singapore

services:
  - type: web
    name: HorrorBurn
    env: ruby
    region: singapore
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Horror_Burn
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
        
DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rake db:migrate:reset
